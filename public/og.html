<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>Fertility Tracker social card</title>
<style>
  :root { --paper: #F6F4EF; --ink: #1F2328; --ink-2: #3D4651; --muted: #5B6470; --line: #E6E1D8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; background: radial-gradient(ellipse at 76% 50%, #fff 0%, var(--paper) 55%); }
  .brand { position: absolute; left: 64px; top: 50px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f0c391 0 18%, transparent 19%), radial-gradient(circle at 60% 62%, #62b7a6 0 22%, transparent 23%), #c9dce9; box-shadow: inset 0 0 0 2px rgba(31,35,40,.2); }
  h1 { position: absolute; left: 64px; top: 104px; width: 560px; margin: 0; font-size: 54px; line-height: 1.02; font-weight: 850; letter-spacing: -0.03em; }
  .sub { position: absolute; left: 64px; top: 246px; width: 560px; margin: 0; font-size: 24px; line-height: 1.35; color: var(--ink-2); }
  .rows { position: absolute; left: 64px; top: 318px; width: 520px; }
  .row { display: flex; align-items: center; gap: 14px; height: 46px; border-top: 1px solid var(--line); font-size: 24px; }
  .row:first-child { border-top: 0; }
  .sw { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(31,35,40,.15); }
  .name { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pct { font-weight: 800; color: #A8382C; font-variant-numeric: tabular-nums; }
  .strip { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; align-items: center; justify-content: space-between; }
  .legend { display: flex; gap: 20px; font-size: 19px; font-weight: 600; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 30px; height: 14px; border-radius: 4px; display: inline-block; }
  .url { font-size: 20px; font-weight: 650; color: var(--muted); }
  canvas { position: absolute; left: 664px; top: 52px; }
</style>
<script defer src="/vendor/d3-array.min.js"></script>
<script defer src="/vendor/d3-geo.min.js"></script>
<script defer src="/vendor/topojson-client.min.js"></script>
<script type="module" src="/js/og.js"></script>
</head>
<body>
<div class="card">
  <div class="brand"><span class="dot"></span>Fertility Tracker</div>
  <h1>Which countries are shrinking, and how fast</h1>
  <p class="sub" id="og-sub">People in 2100 compared with today (UN forecast)</p>
  <div class="rows" id="og-rows"></div>
  <canvas id="og-globe" width="500" height="500" aria-hidden="true"></canvas>
  <div class="strip">
    <div class="legend">
      <span><i style="background:linear-gradient(90deg,#dde8d0,#62b7a6 55%,#13737a)"></i>More people</span>
      <span><i style="background:#eee5cd"></i>About the same</span>
      <span><i style="background:linear-gradient(90deg,#f2d9a9,#ec8447 55%,#be3a30)"></i>Fewer</span>
      <span><i style="background:linear-gradient(90deg,#9a958f,#4c4a48)"></i>Half gone</span>
    </div>
    <div class="url">fertility-tracker-live.vercel.app</div>
  </div>
</div>
</body>
</html>
