<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Fertility Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6.5' fill='%232457FF'/%3E%3Cpath d='M3 9.5c2.5-1.8 7.5-1.8 10 0' stroke='%23fff' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F4EF; color: #1F2328;
    font: 17px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; padding: 24px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.02em; }
  p { color: #3D4651; margin: 0 0 18px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 650; text-decoration: none;
    color: #2457FF; background: #fff; border: 2px solid rgba(36, 87, 255, .35); }
  a.primary { background: #2457FF; color: #fff; border-color: #2457FF; }
  a:focus-visible { outline: 3px solid rgba(36, 87, 255, .45); outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #121518; color: #DDE1E6; }
    p { color: #C3C9D1; }
    a { color: #8FB0FF; background: #1D2227; border-color: rgba(143, 176, 255, .45); }
    a.primary { background: #3A66FF; color: #fff; border-color: #3A66FF; }
    a:focus-visible { outline-color: rgba(143, 176, 255, .8); }
  }
</style>
<script>
  // Vercel serves this file, with a 404, for any missing path. Every place has its own page, and "/KOR" redirects on
  // the server, so what lands here is a lower-case or old form ("/kor", "/country/twn", the GitHub Pages form
  // "/fertility-tracker/KOR"): send it to "/country/KOR". A code with no page ends here, so never send a path to itself.
  (function () {
    var p = location.pathname;
    var m = /^\/(?:fertility-tracker\/|country\/)?([A-Za-z]{3})\/?$/.exec(p);
    if (m) {
      var to = "/country/" + m[1].toUpperCase();
      if (to !== p && to + "/" !== p) return location.replace(to + location.search);
      if (typeof document !== "undefined")
        document.addEventListener("DOMContentLoaded", function () {
          document.getElementById("nf-title").textContent = "We don't have a place with the code " + m[1].toUpperCase() + ".";
        });
    }
  })();
</script>
</head>
<body>
<main>
  <h1 id="nf-title">This page doesn't exist.</h1>
  <p>The globe, every country and the data are still here.</p>
  <p class="links"><a class="primary" href="/">Open the globe</a> <a href="/rankings">Rankings</a> <a href="/api/">Data &amp; API</a></p>
</main>
</body>
</html>
