name: Refresh data and deploy

# Weekly autonomous loop: refetch every source, rebuild public/api/v1/, test + validate, commit only real changes,
# deploy public/ to Vercel (production, https://fertility-tracker-live.vercel.app/). Free: GitHub-hosted runner and
# Vercel Hobby. Secrets: VERCEL_TOKEN (team-scoped deploy token); variables: VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Vercel is not connected to the repo's Git, so only revisions that passed this workflow ever reach production.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test

      - name: Fetch latest sources and rebuild the API
        id: refresh
        # Refuses to overwrite good data (per-country coverage vs the last build, sanity checks, schema validation,
        # sources that worked last time). On pushes a source outage must not block deploying code changes;
        # scheduled and manual runs fail loudly.
        continue-on-error: ${{ github.event_name == 'push' }}
        # --cache keeps this run's downloads (about 65 MB of UN CSVs) for the validation step below.
        run: node scripts/fetch-data.mjs --cache "$RUNNER_TEMP/sources"

      # Compare every published number with the primary sources: UN WPP CSVs (reused from the cache above), the World
      # Bank API and UN DESA's migrant stock tables. Exit 1 = mismatch, 2 = a primary source was unreachable, anything
      # else = the validator itself failed. All of them mean "not validated": scheduled and manual runs stop here,
      # before anything is committed or deployed. Full report in the step summary.
      - name: Validate against the primary sources
        id: validate
        if: steps.refresh.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          set +e
          node scripts/validate-data.mjs --cache "$RUNNER_TEMP/sources" --json "$RUNNER_TEMP/validation.json" > "$RUNNER_TEMP/validation.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/validation.txt"
          { echo '### Data validation against primary sources'; echo '```'; head -c 60000 "$RUNNER_TEMP/validation.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) ;;
            1) echo "::error::published data disagrees with a primary source (see the step summary)" ;;
            2) echo "::error::validate-data could not load a primary source, so this data is unvalidated" ;;
            *) echo "::error::validate-data failed (exit $code)" ;;
          esac
          exit "$code"

      # Only data that was refreshed AND validated in this run may be committed or deployed. A push still deploys its
      # code changes when a source is down or validation fails, but with the last committed data, not this run's.
      - name: Keep the committed data unless this run's data validated
        id: data
        env:
          REFRESH: ${{ steps.refresh.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: |
          if [ "$REFRESH" = "success" ] && [ "$VALIDATE" = "success" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            git checkout -- public/api
            git clean -fdq -- public/api
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "::warning::refresh=$REFRESH validate=$VALIDATE: discarded this run's data; deploying the last committed data"
          fi

      - name: Verify the API files about to be deployed
        run: node scripts/fetch-data.mjs --verify

      # Link previews: X, Slack and search engines don't run JavaScript, so every place gets its own page (title,
      # description, canonical link), its own 1200x630 card picture and server redirects from /KOR, /kor and
      # /country/kor, all from the data about to be deployed. Pages and cards are not committed; vercel.json is, with
      # the data, if a place was added. Inter stands in for the system font the runner lacks.
      - name: Build the share pages and link-preview cards
        run: |
          sudo apt-get install -y -qq fonts-inter > /dev/null 2>&1 || echo "::warning::fonts-inter not installed; cards use the runner's default font"
          node scripts/pages/build-pages.mjs
          node scripts/og/render-cards.mjs
          pages=$(ls public/country | wc -l); cards=$(ls public/og | wc -l)
          echo "Share pages: $pages, cards: $cards"
          test "$pages" -ge 200 && test "$cards" -ge 200

      # Only the revision tested above may be committed and deployed. If the branch moved during this run, stop
      # here without committing or deploying: every push to main starts its own run of this workflow (queued behind
      # this one by the concurrency group), which refreshes, tests and deploys the newer revision. No rebase.
      - name: Check the branch has not moved during this run
        id: head
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$GITHUB_REF_NAME moved during this run ($(git rev-parse --short HEAD) -> $(git rev-parse --short FETCH_HEAD)); not committing or deploying. The run for the newer commit does both."
          fi

      # Only main commits data and deploys to production. A manual run on another branch gets a Vercel preview.
      - name: Commit data if changed
        if: steps.data.outputs.outcome == 'success' && steps.head.outputs.current == 'true' && github.ref == 'refs/heads/main'
        run: |
          # vercel.json changes only when a place is added or removed (its short-link redirects; build-pages.mjs).
          git add -A public/api vercel.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh $(date -u +%F)"
            # Plain fast-forward push: if the branch moved since the check above, this is rejected and nothing deploys.
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Write deploy status (not committed)
        if: steps.head.outputs.current == 'true'
        run: node scripts/fetch-data.mjs --write-status --outcome "${{ steps.data.outputs.outcome || 'unknown' }}" --commit "$(git rev-parse HEAD)"

      - name: Deploy public/ to Vercel (production on main, preview elsewhere)
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          npm install --global --silent vercel@59.11.2
          if [ "$IS_MAIN" = "true" ]; then env=production; prod=--prod; else env=preview; prod=; fi
          vercel pull --yes --environment="$env" --token "$VERCEL_TOKEN"
          # Static build: copies public/ (including the status.json written above) and applies vercel.json headers.
          vercel build $prod --token "$VERCEL_TOKEN"
          # Last guard: if the branch moved while the CLI installed or built, the newer commit's run deploys instead.
          git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::$GITHUB_REF_NAME moved before deploy ($(git rev-parse --short HEAD) -> $(git rev-parse --short FETCH_HEAD)); not deploying."
            exit 0
          fi
          url=$(vercel deploy --prebuilt $prod --yes --token "$VERCEL_TOKEN")
          if [ "$IS_MAIN" = "true" ]; then
            echo "Deployed $url (production alias https://fertility-tracker-live.vercel.app/)"
            echo "### Deployed to Vercel: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview deployed: $url (production untouched)"
            echo "### Vercel preview (production untouched): $url" >> "$GITHUB_STEP_SUMMARY"
          fi
