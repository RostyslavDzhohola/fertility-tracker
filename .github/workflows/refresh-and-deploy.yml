name: Refresh data and deploy

# Weekly autonomous loop: refetch every source, rebuild public/api/v1/, test + validate, commit only real changes,
# deploy public/ to GitHub Pages. Free: GitHub-hosted runner, no secrets beyond the built-in GITHUB_TOKEN.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test

      - name: Fetch latest sources and rebuild the API
        id: refresh
        # Refuses to overwrite good data (per-country coverage vs the last build, sanity checks, schema validation,
        # sources that worked last time). On pushes a source outage must not block deploying code changes;
        # scheduled and manual runs fail loudly.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: node scripts/fetch-data.mjs

      - name: Verify the API files about to be deployed
        run: node scripts/fetch-data.mjs --verify

      # Only the revision tested above may be committed and deployed. If the branch moved during this run, stop
      # here without committing or deploying: every push to main starts its own run of this workflow (queued behind
      # this one by the concurrency group), which refreshes, tests and deploys the newer revision. No rebase.
      - name: Check the branch has not moved during this run
        id: head
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$GITHUB_REF_NAME moved during this run ($(git rev-parse --short HEAD) -> $(git rev-parse --short FETCH_HEAD)); not committing or deploying. The run for the newer commit does both."
          fi

      - name: Commit data if changed
        if: steps.refresh.outcome == 'success' && steps.head.outputs.current == 'true'
        run: |
          git add -A public/api
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh $(date -u +%F)"
            # Plain fast-forward push: if the branch moved since the check above, this is rejected and nothing deploys.
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Write deploy status (not committed)
        if: steps.head.outputs.current == 'true'
        run: node scripts/fetch-data.mjs --write-status --outcome "${{ steps.refresh.outcome || 'unknown' }}" --commit "$(git rev-parse HEAD)"

      - uses: actions/configure-pages@v5
        if: steps.head.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.head.outputs.current == 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
